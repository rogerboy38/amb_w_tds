
name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the PR's base commit is present for the
          # changed-files diff below and for Semgrep's baseline.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # Lint only the files this PR changes, measured from where it branched
      # off the base. Run against every file, main fails 7 of 12 hooks
      # (ruff-format alone would rewrite 190 of 284 Python files), so this
      # gate had never passed once. Changed-files mode holds new work to the
      # standard without forcing a repo-wide reformat that would collide with
      # every open branch. A file you touch must pass as a whole.
      # The repo-wide formatting sweep is a separate, later change.
      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Download Semgrep rules
        # Outside the checkout, so the rules repo's own test files are never scanned.
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git "$RUNNER_TEMP/frappe-semgrep-rules"

      # Same principle: report only findings this PR introduces, measured
      # against the PR's base commit, and fail the step if there are any.
      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep scan --error --baseline-commit ${{ github.event.pull_request.base.sha }} \
            --config "$RUNNER_TEMP/frappe-semgrep-rules/rules" --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
