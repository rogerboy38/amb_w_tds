
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-amb_w_tds-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          # frappe v16.17.5 declares requires-python = ">=3.14,<3.15" (read from
          # the tag's own pyproject, not inferred from an error). Prod runs
          # v16.17.5 on Python 3.14, so this matches what we ship.
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          # frappe v16.17.5's package.json declares engines: { "node": ">=24" }.
          # Read from the pinned version's own manifest, not inferred from the
          # yarn failure — and it agrees with the fleet independently: this bench
          # runs node v24.15.0.
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        # `mariadb-client-10.6` is a 22.04-era package name and does not exist on
        # ubuntu-24.04, which `ubuntu-latest` now resolves to. Every one of the
        # last 50 CI runs died on this line, before bench init / install-app /
        # run-tests — so this pipeline has never reached the test runner.
        # Use the distro's own client (10.11 on 24.04); it talks to the
        # mariadb:10.6 service container without trouble. `apt-get update` first
        # because the runner's package index is not guaranteed to be current.
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          # PIN THE FRAPPE VERSION. Without --frappe-branch, bench init clones
          # frappe's default branch — currently 17.0.0.dev0 — so CI silently
          # tracked an unstable upstream tip. That, not the python version, was
          # the defect behind rung two. v16.17.5 is what prod runs (confirmed
          # from prod's own About page).
          bench init --skip-redis-config-generation --skip-assets --frappe-branch v16.17.5 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app amb_w_tds $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app amb_w_tds
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app amb_w_tds
        env:
          TYPE: server
